name: Harness Smoke

on:
  pull_request:
    branches:
      - develop
      - main
      - release/1.2.0
  push:
    branches:
      - develop
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  powershell-smoke:
    name: PowerShell smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified GitHub tag

      - name: Run harness smoke checks
        shell: pwsh
        run: .\tests\smoke.ps1

      - name: Validate all PowerShell and JSON source syntax
        shell: pwsh
        run: .\tests\release-1-2-static-smoke.ps1

      - name: Validate v1.2.0 candidate provenance and bounded secret patterns
        shell: pwsh
        run: .\\tests\\release-1-2-provenance-smoke.ps1 -ReceiptPath "$env:GITHUB_WORKSPACE\\release-evidence\\provenance-receipt.json"

      - name: Run installer contract smoke checks
        shell: pwsh
        run: .\tests\installer-contract-smoke.ps1

      - name: Run fresh install and upgrade smoke checks
        shell: pwsh
        run: .\tests\install-upgrade-smoke.ps1

      - name: Run doctor readiness smoke checks
        shell: pwsh
        run: .\tests\doctor-readiness-smoke.ps1

      - name: Run v1 end-to-end acceptance gate
        shell: pwsh
        run: .\tests\v1-acceptance-smoke.ps1

      - name: Run end-to-end orchestration smoke checks
        shell: pwsh
        run: .\tests\orchestration-smoke.ps1

      - name: Run lifecycle state smoke checks
        shell: pwsh
        run: .\tests\lifecycle-smoke.ps1

      - name: Run maker checker smoke checks
        shell: pwsh
        run: .\tests\maker-checker-smoke.ps1

      - name: Run lifecycle negative-path smoke checks
        shell: pwsh
        run: .\tests\lifecycle-negative-smoke.ps1

      - name: Run harness audit smoke checks
        shell: pwsh
        run: .\tests\audit-smoke.ps1

      - name: Run integrity audit smoke checks
        shell: pwsh
        run: .\tests\integrity-audit-smoke.ps1

      - name: Run audit report smoke checks
        shell: pwsh
        run: .\tests\audit-report-smoke.ps1

      - name: Run CodeGraph integration smoke checks
        shell: pwsh
        run: .\tests\codegraph-smoke.ps1

      - name: Run curated skills smoke checks
        shell: pwsh
        run: .\tests\skills-smoke.ps1

      - name: Run upstream source audit smoke checks
        shell: pwsh
        run: .\tests\upstream-audit-smoke.ps1

      - name: Run Grill Me native skill smoke checks
        shell: pwsh
        run: .\tests\grill-me-smoke.ps1

      - name: Run decision and handoff skill smoke checks
        shell: pwsh
        run: .\tests\interaction-skills-smoke.ps1

      - name: Run interaction response quality rubric smoke checks
        shell: pwsh
        run: .\tests\interaction-quality-smoke.ps1

      - name: Validate v1.1.0 release readiness plan
        shell: pwsh
        run: .\tests\release-1-1-readiness-smoke.ps1

      - name: Validate v1.2.0 release qualification plan
        shell: pwsh
        run: .\tests\release-1-2-readiness-smoke.ps1

      - name: Validate Q-01 scope review inventory and drift protection
        shell: pwsh
        run: .\tests\release-1-2-scope-review-smoke.ps1

      - name: Run IDE adoption review rubric smoke checks
        shell: pwsh
        run: .\tests\ide-adoption-smoke.ps1

      - name: Validate pending IDE review template and fail-closed scoring
        shell: pwsh
        run: .\tests\ide-evidence-template-smoke.ps1

      - name: Run native skill installation and discovery acceptance checks
        shell: pwsh
        run: .\tests\native-skill-adoption-smoke.ps1

      - name: Benchmark data skill selection and static context footprint
        shell: pwsh
        run: .\tests\data-skill-selection-benchmark.ps1

      - name: Run native data engineering skill smoke checks
        shell: pwsh
        run: .\tests\native-data-skills-smoke.ps1

      - name: Run native .NET and Angular skill smoke checks
        shell: pwsh
        run: .\tests\native-stack-skills-smoke.ps1

      - name: Run harness eval regression checks
        shell: pwsh
        run: .\tests\evals-smoke.ps1

      - name: Run policy and evidence evals
        shell: pwsh
        run: .\tests\policy-evidence-evals.ps1

      - name: Upload provisional provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified GitHub tag
        with:
          name: provisional-v1-2-provenance
          path: release-evidence/provenance-receipt.json
          if-no-files-found: warn
          retention-days: 14

  release-upgrade-rollback:
    name: Pinned v1.2 upgrade and rollback
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout qualification scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified GitHub tag
        with:
          persist-credentials: false

      - name: Checkout published v1.1.0 at immutable SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified GitHub tag
        with:
          ref: 1996bbaef67cf4815ad6c18554bffc9daa5f6ea5
          path: release-fixtures/baseline
          persist-credentials: false

      - name: Checkout nominated v1.2.0 candidate at immutable SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified GitHub tag
        with:
          ref: dfc0436054a7548e0ab78767a0df6fded2eee76f
          path: release-fixtures/candidate
          persist-credentials: false

      - name: Exercise pinned upgrade modes and snapshot restoration
        shell: pwsh
        run: |
          .\tests\release-1-2-upgrade-rollback-smoke.ps1 -BaselineSourcePath "$env:GITHUB_WORKSPACE\release-fixtures\baseline" -CandidateSourcePath "$env:GITHUB_WORKSPACE\release-fixtures\candidate" -ReceiptPath "$env:GITHUB_WORKSPACE\release-evidence\v1-2-upgrade-receipt.json"

      - name: Exercise safe managed upgrade against published v1.1.0
        shell: pwsh
        run: |
          .\\tests\\managed-upgrade-smoke.ps1 -BaselineSourcePath "$env:GITHUB_WORKSPACE\\release-fixtures\\baseline" -CandidateSourcePath "$env:GITHUB_WORKSPACE" -ReceiptPath "$env:GITHUB_WORKSPACE\\release-evidence\\managed-upgrade-receipt.json"

      - name: Upload provisional managed-upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified GitHub tag
        with:
          name: provisional-managed-upgrade
          path: release-evidence/managed-upgrade-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified GitHub tag
        with:
          name: pinned-v1-2-upgrade-rollback
          path: release-evidence/v1-2-upgrade-receipt.json
          if-no-files-found: warn
          retention-days: 14
