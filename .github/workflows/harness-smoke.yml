name: Harness Smoke

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  powershell-smoke:
    name: PowerShell smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run harness smoke checks
        shell: pwsh
        run: .\tests\smoke.ps1

      - name: Run installer contract smoke checks
        shell: pwsh
        run: .\tests\installer-contract-smoke.ps1

      - name: Run fresh install and upgrade smoke checks
        shell: pwsh
        run: .\tests\install-upgrade-smoke.ps1

      - name: Run doctor readiness smoke checks
        shell: pwsh
        run: .\tests\doctor-readiness-smoke.ps1

      - name: Run v1 end-to-end acceptance gate
        shell: pwsh
        run: .\tests\v1-acceptance-smoke.ps1

      - name: Run end-to-end orchestration smoke checks
        shell: pwsh
        run: .\tests\orchestration-smoke.ps1

      - name: Run lifecycle state smoke checks
        shell: pwsh
        run: .\tests\lifecycle-smoke.ps1

      - name: Run maker checker smoke checks
        shell: pwsh
        run: .\tests\maker-checker-smoke.ps1

      - name: Run lifecycle negative-path smoke checks
        shell: pwsh
        run: .\tests\lifecycle-negative-smoke.ps1

      - name: Run harness audit smoke checks
        shell: pwsh
        run: .\tests\audit-smoke.ps1

      - name: Run integrity audit smoke checks
        shell: pwsh
        run: .\tests\integrity-audit-smoke.ps1

      - name: Run audit report smoke checks
        shell: pwsh
        run: .\tests\audit-report-smoke.ps1

      - name: Run CodeGraph integration smoke checks
        shell: pwsh
        run: .\tests\codegraph-smoke.ps1

      - name: Run curated skills smoke checks
        shell: pwsh
        run: .\tests\skills-smoke.ps1

      - name: Run upstream source audit smoke checks
        shell: pwsh
        run: .\tests\upstream-audit-smoke.ps1

      - name: Run Grill Me native skill smoke checks
        shell: pwsh
        run: .\tests\grill-me-smoke.ps1

      - name: Run decision and handoff skill smoke checks
        shell: pwsh
        run: .\tests\interaction-skills-smoke.ps1

      - name: Run interaction response quality rubric smoke checks
        shell: pwsh
        run: .\tests\interaction-quality-smoke.ps1

      - name: Validate v1.1.0 release readiness plan
        shell: pwsh
        run: .\tests\release-1-1-readiness-smoke.ps1

      - name: Run IDE adoption review rubric smoke checks
        shell: pwsh
        run: .\tests\ide-adoption-smoke.ps1

      - name: Run native skill installation and discovery acceptance checks
        shell: pwsh
        run: .\tests\native-skill-adoption-smoke.ps1

      - name: Run native .NET and Angular skill smoke checks
        shell: pwsh
        run: .\tests\native-stack-skills-smoke.ps1

      - name: Run harness eval regression checks
        shell: pwsh
        run: .\tests\evals-smoke.ps1

      - name: Run policy and evidence evals
        shell: pwsh
        run: .\tests\policy-evidence-evals.ps1
