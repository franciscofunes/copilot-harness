name: Harness Smoke

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  powershell-smoke:
    name: PowerShell smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run harness smoke checks
        shell: pwsh
        run: .\tests\smoke.ps1

      - name: Run CodeGraph integration smoke checks
        shell: pwsh
        run: .\tests\codegraph-smoke.ps1

      - name: Run curated skills smoke checks
        shell: pwsh
        run: .\tests\skills-smoke.ps1

      - name: Run harness eval regression checks
        shell: pwsh
        run: .\tests\evals-smoke.ps1

      - name: Run policy and evidence evals
        shell: pwsh
        run: .\tests\policy-evidence-evals.ps1
